[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-schema"
version = "0.1.0"
description = "Shared SQLAlchemy models and Alembic migrations for kb.agent-mate.ai"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kb_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
