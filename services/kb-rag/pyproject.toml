[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-rag"
version = "0.1.0"
description = "RAG indexing and retrieval service for kb.agent-mate.ai"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "qdrant-client>=1.12.0",
  "pydantic-settings>=2.6.0",
  "kb-schema",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
kb-schema = { path = "../../packages/kb_schema", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
