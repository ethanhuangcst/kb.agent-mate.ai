[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-agent"
version = "0.1.0"
description = "Knowledge agent REST facade for kb.agent-mate.ai"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "bcrypt>=4.2.0",
  "openai>=1.60.0",
  "mcp>=1.8.0",
  "pypdf>=5.0.0",
  "kb-schema",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
