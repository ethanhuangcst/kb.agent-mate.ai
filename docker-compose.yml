# Local stack per specs/architecture.md — Postgres + Qdrant + three services.
# Usage: make up | make down | make dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: kb-postgres
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb_dev_password
      POSTGRES_DB: kb_agent
    ports:
      - "5434:5432"
    volumes:
      - kb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: kb-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - kb_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q ready'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kb-rag:
    build:
      context: .
      dockerfile: services/kb-rag/Dockerfile
    container_name: kb-rag
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://kb:kb_dev_password@postgres:5432/kb_agent
      QDRANT_URL: http://qdrant:6333
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-dev-rag-token}
      BLOB_ROOT: /data/blob
      USE_FAKE_EMBEDDER: "true"
    ports:
      - "8001:8001"
    volumes:
      - ./data/blob:/data/blob
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  kb-agent:
    build:
      context: .
      dockerfile: services/kb-agent/Dockerfile
    container_name: kb-agent
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://kb:kb_dev_password@postgres:5432/kb_agent
      RAG_BASE_URL: http://kb-rag:8001
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-dev-rag-token}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-dev-api-key-pepper-change-me}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kb-rag:
        condition: service_started

  kb-web:
    build:
      context: .
      dockerfile: apps/kb-web/Dockerfile
    container_name: kb-web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kb:kb_dev_password@postgres:5432/kb_agent
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-32chars}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-dev-api-key-pepper-change-me}
      AGENT_BASE_URL: http://kb-agent:8000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kb-agent:
        condition: service_started

volumes:
  kb_pg_data:
  kb_qdrant_data:
