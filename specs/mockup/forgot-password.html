<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重设密码 · kb.agent-mate.ai</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <a class="logo" href="index.html" aria-label="kb.agent-mate.ai">
          <img class="logo-full" src="logo.png" alt="kb.agent-mate.ai" width="80" height="80" />
        </a>
        <p class="eyebrow">Password</p>
        <h1>重设密码</h1>
        <p class="lead">若邮箱对应管理员账号，将收到 Resend 重置链接。</p>
        <hr class="rule" />
        <form class="form" action="login.html" method="get">
          <label>
            邮箱
            <input type="email" name="email" placeholder="name@domain.com" />
          </label>
          <div class="form-actions btn-row">
            <button type="submit" class="btn">发送链接</button>
            <a class="btn-text" href="login.html">返回登录</a>
          </div>
        </form>
        <a class="back-link" href="index.html">全部界面</a>
      </div>
    </div>
  </body>
</html>
