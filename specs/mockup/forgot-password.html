<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重设密码 · kb.agent-mate.ai</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="auth-main">
        <div class="auth-card">
        <a class="logo logo-auth" href="index.html" aria-label="kb.agent-mate.ai">
          <img class="logo-full" src="logo.png" alt="" width="56" height="56" />
          <span class="logo-word">kb.agent-mate.ai</span>
        </a>
        <p class="eyebrow">Reset</p>
        <h1>重设密码</h1>
        <p class="lead">若邮箱对应管理员账号，将收到 Resend 重置链接。</p>
        <hr class="rule" />
        <form class="form" action="login.html" method="get">
          <label>
            邮箱
            <input type="email" name="email" placeholder="name@domain.com" />
          </label>
          <div class="form-actions btn-row">
            <button type="submit" class="btn">发送链接</button>
            <a class="btn-text" href="login.html">返回登录</a>
          </div>
        </form>
        <a class="back-link" href="index.html">返回首页</a>
      </div>
      </main>
      <footer class="site-footer">
        <p>copyright ® Ethan Huang</p>
      </footer>
    </div>
  </body>
</html>
