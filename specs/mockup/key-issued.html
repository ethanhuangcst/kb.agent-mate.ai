<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Key 已生成 · kb.agent-mate.ai</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="logo" href="index.html" aria-label="kb.agent-mate.ai">
          <img class="logo-header-mark" src="logo.png" alt="" width="36" height="36" />
          <span class="logo-word">kb.agent-mate.ai</span>
        </a>
        <p class="hello">Hello, <span class="hello-name">Admin</span></p>
      </header>
      <div class="app-body">
        <aside class="sidebar">
          <nav class="nav" aria-label="管理导航">
            <a class="active" href="users.html">使用者</a>
            <a href="admins.html">管理员</a>
            <a href="login.html">退出</a>
          </nav>
        </aside>
        <div class="main">
          <div class="content">
            <div class="page-head">
              <div>
                <p class="eyebrow">Issued</p>
                <h1>Key 已生成</h1>
              </div>
            </div>
            <div class="key-panel">
              <div class="code-block">
                <button type="button" class="btn-copy" data-copy-btn aria-label="复制 Key" title="复制">
                  <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                    <rect x="9" y="9" width="11" height="11" rx="0" />
                    <path d="M5 15V5h10" />
                  </svg>
                  <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                    <path d="M5 12.5l4.5 4.5L19 7" />
                  </svg>
                </button>
                <pre><code data-copy-text>kb_live_3f8a9c2e1b0d4f67a8e9c0d1b2a3f4e5</code></pre>
              </div>
              <p class="warn">请立即复制并安全存放。</p>
            </div>
            <div class="btn-row" style="margin-top: 2rem">
              <a class="btn btn-ghost" href="users.html">返回列表</a>
            </div>
          </div>
        </div>
      </div>
      <footer class="site-footer">
        <p>copyright ® Ethan Huang</p>
      </footer>
    </div>
    <script>
      document.querySelectorAll("[data-copy-btn]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const block = btn.closest(".code-block");
          const text = block?.querySelector("[data-copy-text]")?.textContent?.trim() || "";
          try {
            await navigator.clipboard.writeText(text);
            btn.classList.add("is-copied");
            setTimeout(() => btn.classList.remove("is-copied"), 1600);
          } catch (_) {}
        });
      });
    </script>
  </body>
</html>
