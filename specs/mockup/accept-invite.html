<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>接受邀请 · kb.agent-mate.ai</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="auth-main">
        <div class="auth-card">
        <a class="logo logo-auth" href="index.html" aria-label="kb.agent-mate.ai">
          <img class="logo-full" src="logo.png" alt="" width="56" height="56" />
          <span class="logo-word">kb.agent-mate.ai</span>
        </a>
        <p class="eyebrow">Invite</p>
        <h1>设置密码</h1>
        <p class="lead">邀请邮箱 <span class="mono">alex@example.com</span></p>
        <hr class="rule" />
        <form class="form" action="users.html" method="get">
          <label>
            用户名
            <input
              type="text"
              name="username"
              autocomplete="username"
              placeholder="kbadmin"
              pattern="[A-Za-z][A-Za-z0-9._-]{2,63}"
              title="字母开头；字母、数字与 ._- ；3–64 字符"
              required
            />
          </label>
          <p class="hint">用于登录；不可与已有管理员用户名重复（大小写不敏感）。</p>
          <label>
            姓名（英文）
            <input
              type="text"
              name="display_name"
              autocomplete="name"
              placeholder="Alex Chen"
              pattern="[A-Za-z][A-Za-z .'-]{0,63}"
              title="仅限英文字母、空格与常见标点"
              required
            />
          </label>
          <p class="hint">仅允许英文字母、空格与 <span class="mono">.'-</span>。</p>
          <label>
            新密码
            <input type="password" name="password" autocomplete="new-password" placeholder="至少 12 位" required />
          </label>
          <label>
            确认密码
            <input type="password" name="password2" autocomplete="new-password" placeholder="再次输入" required />
          </label>
          <div class="form-actions btn-row">
            <button type="submit" class="btn">完成</button>
          </div>
        </form>
        <a class="back-link" href="index.html">返回首页</a>
      </div>
      </main>
      <footer class="site-footer">
        <p>copyright ® Ethan Huang</p>
      </footer>
    </div>
  </body>
</html>
