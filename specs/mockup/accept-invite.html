<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>接受邀请 · kb.agent-mate.ai</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <a class="logo" href="index.html" aria-label="kb.agent-mate.ai">
          <img class="logo-full" src="logo.png" alt="kb.agent-mate.ai" width="80" height="80" />
        </a>
        <p class="eyebrow">Invite</p>
        <h1>设置密码</h1>
        <p class="lead">邀请邮箱 <span class="mono">alex@example.com</span></p>
        <hr class="rule" />
        <form class="form" action="users.html" method="get">
          <label>
            新密码
            <input type="password" name="password" autocomplete="new-password" placeholder="至少 12 位" />
          </label>
          <label>
            确认密码
            <input type="password" name="password2" autocomplete="new-password" placeholder="再次输入" />
          </label>
          <div class="form-actions btn-row">
            <button type="submit" class="btn">完成</button>
          </div>
        </form>
        <a class="back-link" href="index.html">全部界面</a>
      </div>
    </div>
  </body>
</html>
