<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>修改密码 · kb.agent-mate.ai</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="auth-main">
        <div class="auth-card">
        <a class="logo logo-auth" href="index.html" aria-label="kb.agent-mate.ai">
          <img class="logo-full" src="logo.png" alt="" width="56" height="56" />
          <span class="logo-word">kb.agent-mate.ai</span>
        </a>
        <p class="eyebrow">Admin · 首次登录</p>
        <h1>修改密码</h1>
        <p class="lead">检测到默认种子口令，须更换后方可使用签发 Key、邀请等能力。经邀请或重置自设密码的管理员不会进入本页。</p>
        <hr class="rule" />
        <form class="form" action="users.html" method="get">
          <label>
            新密码
            <span class="password-field">
              <input type="password" name="new_password" autocomplete="new-password" placeholder="••••••••••••" />
              <button type="button" class="password-toggle" aria-label="显示密码" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </span>
          </label>
          <label>
            确认新密码
            <span class="password-field">
              <input type="password" name="new_password_confirm" autocomplete="new-password" placeholder="••••••••••••" />
              <button type="button" class="password-toggle" aria-label="显示密码" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </span>
          </label>
          <div class="form-actions btn-row">
            <button type="submit" class="btn">保存并继续</button>
          </div>
        </form>
        <a class="back-link" href="login.html">返回登录</a>
      </div>
      </main>
      <footer class="site-footer">
        <p>copyright ® Ethan Huang</p>
      </footer>
    </div>
  </body>
</html>
