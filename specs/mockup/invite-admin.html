<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>邀请管理员 · kb.agent-mate.ai</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">

      <header class="app-header">
        <a class="logo" href="index.html" aria-label="kb.agent-mate.ai">
          <img class="logo-header-mark" src="logo.png" alt="" width="36" height="36" />
          <span class="logo-word">kb.agent-mate.ai</span>
        </a>
        <p class="hello">Hello, <span class="hello-name">Admin</span></p>
      </header>
      <div class="app-body">
        <aside class="sidebar">
          <nav class="nav" aria-label="管理导航">
            <a href="users.html">使用者</a>
            <a class="active" href="admins.html">管理员</a>
            <a href="login.html">退出</a>
          </nav>
        </aside>
        <div class="main">
          <div class="content">
            <div class="page-head">
              <div>
                <p class="eyebrow">Admins</p>
                <h1>邀请管理员</h1>
                <p>对方将收到设密链接，并可设置用户名与英文姓名。开放自助注册已关闭。</p>
              </div>
            </div>
            <form class="form" action="accept-invite.html" method="get" style="max-width: 420px">
              <label>
                邮箱
                <input type="email" name="email" placeholder="colleague@domain.com" required />
              </label>
              <p class="hint">邮件由 Resend 发送，链接短时有效。</p>
              <div class="form-actions btn-row">
                <button type="submit" class="btn">发送邀请</button>
                <a class="btn btn-ghost" href="admins.html">取消</a>
              </div>
            </form>
          </div>
        </div>
      </div>
      <footer class="site-footer">
        <p>copyright ® Ethan Huang</p>
      </footer>
    </div>
  </body>
</html>
