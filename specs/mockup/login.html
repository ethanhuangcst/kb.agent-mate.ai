<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · kb.agent-mate.ai</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="auth-main">
        <div class="auth-card">
        <a class="logo logo-auth" href="index.html" aria-label="kb.agent-mate.ai">
          <img class="logo-full" src="logo.png" alt="" width="56" height="56" />
          <span class="logo-word">kb.agent-mate.ai</span>
        </a>
        <p class="eyebrow">Admin</p>
        <h1>登录</h1>
        <p class="lead">
          开放注册已关闭。
          <span class="contact-admin">
            <button type="button" class="contact-admin-trigger" aria-describedby="login-wechat-qr">
              联系管理员
            </button>
            <span id="login-wechat-qr" class="contact-admin-pop" role="tooltip">
              <img src="EthanWeChat.png" alt="管理员微信二维码" width="180" height="180" />
              <span class="contact-admin-caption">微信扫码联系</span>
            </span>
          </span>
          获得 api-key
        </p>
        <hr class="rule" />
        <form class="form" action="change-password.html" method="get">
          <label>
            用户名或邮箱
            <input type="text" name="login" autocomplete="username" placeholder="admin" />
          </label>
          <label>
            密码
            <span class="password-field">
              <input type="password" name="password" autocomplete="current-password" placeholder="••••••••••••" />
              <button type="button" class="password-toggle" aria-label="显示密码" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </span>
          </label>
          <div class="form-actions btn-row">
            <button type="submit" class="btn">登录</button>
            <a class="btn-text" href="forgot-password.html">重设密码</a>
          </div>
        </form>
        <a class="back-link" href="index.html">返回首页</a>
      </div>
      </main>
      <footer class="site-footer">
        <p>copyright ® Ethan Huang</p>
      </footer>
    </div>
  </body>
</html>
