<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · kb.agent-mate.ai</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <a class="logo" href="index.html" aria-label="kb.agent-mate.ai">
          <img class="logo-full" src="logo.png" alt="kb.agent-mate.ai" width="80" height="80" />
        </a>
        <p class="eyebrow">Admin</p>
        <h1>登录</h1>
        <p class="lead">开放注册已关闭。初始化默认账号 <code>admin</code> / <code>admin</code> 须改密；经邀请自设密码者登录后无需再改。</p>
        <hr class="rule" />
        <form class="form" action="change-password.html" method="get">
          <label>
            用户名或邮箱
            <input type="text" name="login" autocomplete="username" placeholder="admin" />
          </label>
          <label>
            密码
            <input type="password" name="password" autocomplete="current-password" placeholder="••••••••••••" />
          </label>
          <div class="form-actions btn-row">
            <button type="submit" class="btn">登录</button>
            <a class="btn-text" href="forgot-password.html">重设密码</a>
          </div>
        </form>
        <a class="back-link" href="index.html">全部界面</a>
      </div>
    </div>
  </body>
</html>
